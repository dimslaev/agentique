server {
  listen 80;

  # Prerendered blog pages get a real 404 for unknown slugs instead of
  # falling through to the SPA shell (a 200 "soft 404" that search engines
  # treat as thin/duplicate content).
  location /blog {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
