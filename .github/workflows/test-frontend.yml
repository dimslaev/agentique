name: Test Frontend

on:
  push:
    branches:
      - master
  pull_request:
permissions: {}

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # tsc + vite build + blog prerender — the only place a frontend type
      # error surfaces in CI now that Playwright is parked.
      - name: Build
        run: bun run build
        working-directory: frontend
