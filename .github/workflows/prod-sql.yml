name: Prod SQL

# Break-glass writes against the prod db, run by the self-hosted runner on the
# box. Postgres stays on loopback — this is the remote-access path that does
# not open a port. Every run is an Actions entry with the statement, the output
# and who dispatched it.
#
# Writes only. Reads moved to the MCP `sql_query` tool (backend/app/mcp/), which
# is the same agentique_ro role without a workflow_dispatch round trip.
#
# Needs on the box: /usr/local/bin/agentique-sql, the two roles from
# deploy/sql-roles.sql, and the sudoers rule — see deploy/README.md.

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SQL to run (newlines allowed via the API; all statements run in one transaction)"
        required: true
        type: string
      confirm:
        description: "Type WRITE to confirm."
        required: true
        type: string
        default: ""

run-name: "prod-sql (write) by @${{ github.actor }}"

permissions: {}

# Serialise: two writers on one db at once is nobody's idea of a good time.
concurrency:
  group: prod-sql
  cancel-in-progress: false

jobs:
  sql:
    runs-on:
      - self-hosted
      - production
    environment: production
    timeout-minutes: 10
    steps:
      # No checkout: the wrapper is root-owned at /usr/local/bin, so this job
      # needs nothing from the repo.
      - name: Run SQL
        env:
          SQL: ${{ inputs.sql }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != WRITE ]; then
            echo "needs confirm=WRITE" >&2
            exit 1
          fi
          printf '%s\n' "$SQL" \
            | sudo /usr/local/bin/agentique-sql write \
            | tee "$RUNNER_TEMP/sql-output.txt"

      - name: Summary
        if: always()
        env:
          SQL: ${{ inputs.sql }}
        run: |
          set -euo pipefail
          {
            printf '### prod-sql (write)\n\n```sql\n%s\n```\n\n' "$SQL"
            printf '```\n'
            head -c 60000 "$RUNNER_TEMP/sql-output.txt" 2>/dev/null || true
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
