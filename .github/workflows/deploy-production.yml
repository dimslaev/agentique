name: Deploy to Production

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.${{ secrets.DOMAIN_PRODUCTION }}
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: build
    runs-on:
      - self-hosted
      - production
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.18"
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend-dist
      # The workspace is a staging area only — actions/checkout resets it every
      # run, so the services live in /opt/agentique. .env and .venv belong to
      # the box; frontend/dist is replaced separately below.
      - name: Sync source to /opt/agentique
        run: >
          rsync -a --delete
          --exclude '.git'
          --exclude '.env'
          --exclude '.venv'
          --exclude 'frontend/dist'
          --exclude 'frontend-dist'
          ./ /opt/agentique/
      - name: Sync frontend dist
        run: rsync -a --delete frontend-dist/ /opt/agentique/frontend/dist/
      # --package app: the workspace root is virtual, a bare sync would not
      # install the backend (same flag the old Dockerfile used).
      - name: Sync venv
        run: uv sync --frozen --package app
        working-directory: /opt/agentique
      # --env-file is load-bearing: prestart.sh's seed guard checks the shell
      # ENVIRONMENT, and a bare deploy shell doesn't have it.
      - name: Run migrations + prestart
        run: uv run --env-file ../.env bash scripts/prestart.sh
        working-directory: /opt/agentique/backend
      - name: Restart backend
        run: sudo systemctl restart agentique-backend
