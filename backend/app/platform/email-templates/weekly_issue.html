<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#f6f4ec;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f6f4ec;">
<tr><td align="center" style="padding:32px 20px;">
<table role="presentation" width="560" border="0" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;">
<tr><td style="padding:0 0 28px 0;">
  <a href="{{ site_url }}" style="font-family:'Archivo','Arial Black',Helvetica,Arial,sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.01em;color:#16180f;text-decoration:none;">agentique</a>
</td></tr>
<tr><td style="font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#16180f;">
  {% for block in blocks %}
  {% if block.kind == "ul" %}
  <ul style="margin:0 0 18px 0;padding-left:22px;">
    {% for line in block.lines %}<li style="margin:0 0 6px 0;">{{ line }}</li>{% endfor %}
  </ul>
  {% else %}
  <p style="margin:0 0 18px 0;">{{ block.lines[0] }}</p>
  {% endif %}
  {% endfor %}
</td></tr>
<tr><td style="padding:20px 0 0 0;border-top:1px solid #dcd9cc;font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6d6f5c;">
  <a href="{{ site_url }}/feed" style="color:#6d6f5c;text-decoration:underline;">Check the feed</a>
  &nbsp;&middot;&nbsp;
  <a href="{{ unsubscribe_url }}" style="color:#6d6f5c;text-decoration:underline;">Unsubscribe</a>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
