<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in to Agentique</title>
  </head>
  <body style="margin:0;padding:0;background-color:#fafbfc;">
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#fafbfc;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;">
            <tr>
              <td style="padding:40px 32px;font-family:Arial, Helvetica, sans-serif;color:#333333;">
                <h1 style="margin:0 0 20px;font-size:22px;line-height:1.3;font-weight:bold;">Sign in to Agentique</h1>
                <p style="margin:0 0 28px;font-size:16px;line-height:1.5;color:#555555;">
                  Here is your sign-in link. It doesn't expire, so you can keep this email and use it again.
                </p>
                <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td bgcolor="#111111" style="border-radius:6px;">
                      <a href="{{ link }}" target="_blank" style="display:inline-block;padding:12px 24px;font-family:Arial, Helvetica, sans-serif;font-size:16px;color:#ffffff;text-decoration:none;">Sign in to Agentique</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:32px 0 0;padding-top:20px;border-top:1px solid #e5e5e5;font-size:13px;line-height:1.5;color:#888888;">
                  Didn't ask for this? You can ignore it. Don't forward it: the link signs anyone in as you.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
