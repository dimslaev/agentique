[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]>=0.138.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<10.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pgvector>=0.3.0",
    "model2vec>=0.4.0",
    "baml-py>=0.223.0",
    "trafilatura>=2.0.0",
    "feedparser>=6.0.0",
    "dnspython>=2.6.0",
    "regex>=2024.0.0",
    "resend>=2.0.0",
    "imap-tools>=1.5.0",
    "kdriveclientpy>=1.0.7",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
disallow_any_explicit = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
# Must match requires-python above. py314 lets the formatter emit PEP 758
# `except A, B:` without parentheses, which is a SyntaxError on the 3.13 this
# actually runs on - and the formatter rewrites silently.
target-version = "py313"
# baml_client is generated by `baml-cli generate` - never hand-edited.
exclude = ["alembic", "baml_client"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
    "D100",   # every module needs a one-sentence docstring
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.isort]
# Every module opens the same way - closes the "27 of 29 pipeline modules
# have it, 0 of 19 app modules do" gap for good instead of relying on memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# The pipeline and ops scripts log to stdout via print() so systemd/journald
# captures it.
"pipeline/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
# Domain tests live inside the domain (ADR 4); `tests/` keeps what belongs to
# no single domain - the pipeline, the schema-wide enum guard, ops scripts.
testpaths = ["app", "pipeline", "tests"]

[tool.coverage.run]
source = ["app", "pipeline"]
# Colocated tests are inside `source`; measuring the tests themselves would
# only inflate the number.
omit = ["*/tests/*"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
# `scripts/` is deliberately outside `source`: those are ops entrypoints run by
# prestart.sh and by hand, not by pytest, so measuring them would only report a
# number nobody can act on.

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
